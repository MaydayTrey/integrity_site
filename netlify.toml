# Netlify build settings: static site, no build step.
[build]
  publish = "."

# Security headers + CSP. Netlify also honours a _headers file; keeping
# them in one place (here) avoids the two drifting apart.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # script-src: self + jsdelivr (GSAP). style-src: self + Google Fonts CSS.
    # font-src: Google's font files. img-src: data: for inline SVG masks,
    # tile.openstreetmap.org for the map tiles. style-src jsdelivr for leaflet.css.
    # script-src census: the address check uses its JSONP geocoder; connect-src photon: fallback geocoder, geoapify: optional address suggestions.
    # form-action self keeps Netlify Forms posting to this origin only.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://geocoding.geo.census.gov; style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' https://photon.komoot.io https://api.geoapify.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# Long cache for fingerprint-free assets we control; HTML stays fresh.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Unknown paths get 404.html WITH a 404 status. Netlify does this on its
# own when 404.html exists; the rule makes it explicit. No force, so real
# files are never shadowed. Verify after deploy:
#   curl -s -o /dev/null -w "%{http_code}" https://integrityrnr.com/nope
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# llms.txt changes with the business facts, so it should not sit in
# caches for a year like the fingerprint-free assets do
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "text/plain; charset=utf-8"
